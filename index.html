<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Προϋπολογισμός</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --sur:#0B0B0C;          /* κάρτες */
  --sur-2:#141416;        /* πεδία */
  --hair:rgba(255,255,255,.09);
  --hair-2:rgba(255,255,255,.16);
  --fg:#F4F3F0;           /* bone */
  --dim:#7A7A7E;
  --faint:#3A3A3D;
  --amber:#E9C46A;        /* το μοναδικό «ζεστό» — CTA + σήμερα */
  --clay:#E0937C;         /* έξοδα */
  --mint:#A9CFB4;         /* έσοδα */
  --f:'Outfit',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f); font-weight:300;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
/* απαλή λάμψη στην κορυφή, ώστε το μαύρο να μη μοιάζει επίπεδο */
body::before{
  content:"";position:fixed;inset:0 0 auto;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 50% 0%, rgba(233,196,106,.07) 0%, transparent 62%);
}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(128px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:var(--f);cursor:pointer;border:0;color:inherit}
:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
.hair{height:1px;background:var(--hair);border:0}

/* ── Topbar ── */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.top .m{font-size:.95rem;font-weight:400;letter-spacing:.01em}
.top .y{color:var(--dim);font-weight:200}
.sync{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:300;color:var(--dim);
  background:transparent;padding:8px 13px;border-radius:100px;border:1px solid var(--hair)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--mint);flex:none}
.dot.off{background:var(--clay)} .dot.busy{background:var(--amber);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}

/* ── Ήρωας: το υπόλοιπο ── */
.hero{margin-bottom:30px}
.kicker{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:400}
.bal{font-size:4.1rem;font-weight:200;letter-spacing:-.045em;line-height:1;margin:14px 0 22px;
  transition:opacity .3s}
.bal.neg{color:var(--clay)}
.duo{display:flex;align-items:stretch;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.duo>div{flex:1;padding:15px 0}
.duo>div+div{border-left:1px solid var(--hair);padding-left:18px}
.duo .k{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:400}
.duo .v{font-size:1.25rem;font-weight:200;letter-spacing:-.02em;margin-top:6px}
.duo .v.in{color:var(--mint)} .duo .v.out{color:var(--clay)}

/* ── Υπογραφή: η καμπύλη του μήνα (λεπτές γραμμές) ── */
.strip{display:flex;align-items:flex-end;gap:3px;height:52px;margin-top:26px}
.strip i{flex:1;background:var(--faint);border-radius:1px;min-height:1px;
  transition:height .5s cubic-bezier(.16,1,.3,1)}
.strip i.spent{background:linear-gradient(180deg,var(--clay),rgba(224,147,124,.18))}
.strip i.today{background:var(--amber)}
.strip i.future{background:rgba(255,255,255,.06);height:1px!important}
.slbl{display:flex;justify-content:space-between;margin-top:10px;
  font-size:.64rem;color:var(--dim);font-weight:300;letter-spacing:.06em}

/* ── Λίστα ── */
.sec{display:flex;align-items:center;gap:12px;margin:38px 0 4px}
.sec span{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  font-weight:400;white-space:nowrap}
.sec .hair{flex:1}
.item{display:flex;align-items:center;gap:14px;padding:17px 2px;border-bottom:1px solid var(--hair)}
.item .tick{width:2px;height:26px;border-radius:2px;flex:none;background:var(--clay);opacity:.85}
.item .tick.in{background:var(--mint)}
.item .txt{flex:1;min-width:0}
.item .t1{font-size:.95rem;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:.74rem;color:var(--dim);margin-top:3px;font-weight:300;letter-spacing:.02em}
.item .amt{font-size:1.02rem;font-weight:300;white-space:nowrap;letter-spacing:-.01em}
.item .amt.out{color:var(--clay)} .item .amt.in{color:var(--mint)}
.empty{color:var(--dim);font-size:.85rem;font-weight:300;text-align:center;padding:34px 0}

/* ── Actions ── */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;
  max-width:520px;margin:0 auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(0,0,0,0),#000 38%)}
.act{display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;
  border-radius:100px;font-size:.94rem;font-weight:400;transition:transform .12s}
.act:active{transform:scale(.97)}
.act.scan{flex:1.6;background:var(--amber);color:#0A0904;font-weight:500}
.act.manual{flex:1;background:transparent;border:1px solid var(--hair-2);color:var(--fg)}

/* ── Bottom sheet ── */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;
  background:var(--sur);border:1px solid var(--hair);border-bottom:0;
  border-radius:30px 30px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .42s cubic-bezier(.16,1,.3,1);
  max-height:92vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:3px;border-radius:3px;background:var(--hair-2);margin:8px auto 20px}

.seg{display:flex;gap:0;border:1px solid var(--hair);border-radius:100px;padding:3px;margin-bottom:26px}
.seg button{flex:1;background:transparent;color:var(--dim);border-radius:100px;padding:11px 0;
  font-size:.88rem;font-weight:400;transition:.2s}
.seg button.on{background:var(--sur-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--hair)}

.lbl{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  font-weight:400;margin-bottom:10px;display:block}

/* Ποσό: μεγάλο, ultralight, με το € αχνό δίπλα */
.amtbox{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--hair-2);
  padding-bottom:10px;margin-bottom:26px}
.amtbox input{flex:1;background:transparent;border:0;color:var(--fg);
  font-family:var(--f);font-size:2.6rem;font-weight:200;letter-spacing:-.04em;padding:0;
  font-variant-numeric:tabular-nums}
.amtbox input::placeholder{color:var(--faint)}
.amtbox input:focus{outline:none}
.amtbox .cur{font-size:1.4rem;font-weight:200;color:var(--dim)}

/* Κατηγορίες ως chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{padding:10px 15px;border-radius:100px;border:1px solid var(--hair);background:transparent;
  color:var(--dim);font-size:.84rem;font-weight:300;transition:.18s;white-space:nowrap}
.chip.on{background:var(--fg);color:#000;border-color:var(--fg);font-weight:400}

.field{margin-bottom:26px}
.field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair);
  color:var(--fg);font-family:var(--f);font-size:1.05rem;font-weight:300;padding:0 0 11px}
.field input::placeholder{color:var(--faint)}
.field input:focus{outline:none;border-bottom-color:var(--hair-2)}
.field input[type=date]{color-scheme:dark}

.thumb{display:none;margin-bottom:22px;border-radius:18px;overflow:hidden;position:relative;
  border:1px solid var(--hair)}
.thumb img{width:100%;max-height:140px;object-fit:cover;display:block;opacity:.55}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
  justify-content:center;gap:10px;font-size:.85rem;font-weight:300;color:var(--amber);letter-spacing:.04em}
.spin{width:13px;height:13px;border:1px solid rgba(233,196,106,.25);border-top-color:var(--amber);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.save{width:100%;padding:18px;border-radius:100px;background:var(--fg);color:#000;
  font-size:.96rem;font-weight:500;transition:transform .12s}
.save:active{transform:scale(.98)}
.save[disabled]{opacity:.35}

/* ── Setup ── */
.setup{padding-top:60px}
.setup h1{font-size:2.1rem;font-weight:200;letter-spacing:-.035em;margin-bottom:12px}
.setup p{color:var(--dim);font-size:.9rem;font-weight:300;line-height:1.6;margin-bottom:36px}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));z-index:40;
  transform:translate(-50%,60px);opacity:0;transition:.3s cubic-bezier(.16,1,.3,1);
  background:var(--sur-2);border:1px solid var(--hair-2);color:var(--fg);
  padding:13px 22px;border-radius:100px;font-size:.83rem;font-weight:300;
  max-width:88%;text-align:center;letter-spacing:.01em}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--clay);color:var(--clay)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- Πρώτη ρύθμιση -->
<div class="wrap setup" id="setup" hidden>
  <h1>Σύνδεση</h1>
  <p>Η διεύθυνση του Web App και ο κωδικός σου. Αποθηκεύονται μόνο σε αυτή τη συσκευή.</p>
  <div class="field">
    <span class="lbl">Web app URL</span>
    <input type="url" id="sUrl" placeholder="https://script.google.com/…/exec" autocomplete="off">
  </div>
  <div class="field">
    <span class="lbl">Κωδικός εφαρμογής</span>
    <input type="password" id="sTok" placeholder="APP_TOKEN" autocomplete="off">
  </div>
  <button class="save" onclick="saveSetup()">Σύνδεση</button>
</div>

<!-- Κύρια οθόνη -->
<div class="wrap" id="app" hidden>
  <div class="top">
    <div class="m"><span id="mName">—</span> <span class="y" id="mYear"></span></div>
    <button class="sync" onclick="refresh()">
      <span class="dot" id="dot"></span><span id="syncTxt">Συγχρονισμένο</span>
    </button>
  </div>

  <section class="hero">
    <div class="kicker">Υπόλοιπο</div>
    <div class="bal num" id="bal">—</div>
    <div class="duo">
      <div><div class="k">Έσοδα</div><div class="v in num" id="inc">—</div></div>
      <div><div class="k">Έξοδα</div><div class="v out num" id="exp">—</div></div>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="slbl"><span>1</span><span id="sToday"></span><span id="sEnd"></span></div>
  </section>

  <div class="sec"><span>Κινήσεις</span><hr class="hair"></div>
  <div id="list"><div class="empty">Καμία κίνηση ακόμη</div></div>
</div>

<div class="actions" id="actions" hidden>
  <button class="act scan" onclick="pickPhoto()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    Σκάναρε απόδειξη
  </button>
  <button class="act manual" onclick="openSheet('expense')">Χειροκίνητα</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden onchange="onPhoto(this)">

<!-- Φόρμα -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>

  <div class="seg">
    <button id="tE" class="on" onclick="setType('expense')">Έξοδο</button>
    <button id="tI" onclick="setType('income')">Έσοδο</button>
  </div>

  <div class="thumb" id="thumb">
    <img id="thumbImg" alt="">
    <div class="ov" id="thumbOv"><span class="spin"></span>Ανάγνωση…</div>
  </div>

  <span class="lbl">Ποσό</span>
  <div class="amtbox">
    <input type="number" id="fAmt" inputmode="decimal" step="0.01" min="0" placeholder="0">
    <span class="cur">€</span>
  </div>

  <span class="lbl">Κατηγορία</span>
  <div class="chips" id="chips"></div>

  <div class="field">
    <span class="lbl">Περιγραφή</span>
    <input type="text" id="fDesc" placeholder="προαιρετικά" autocomplete="off">
  </div>

  <div class="field">
    <span class="lbl">Ημερομηνία</span>
    <input type="date" id="fDate">
  </div>

  <button class="save" id="saveBtn" onclick="save()">Καταχώρηση</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG = {
  get url(){ return localStorage.getItem('api_url') || ''; },
  get token(){ return localStorage.getItem('api_token') || ''; },
  save(u,t){ localStorage.setItem('api_url',u); localStorage.setItem('api_token',t); }
};

let CATS = {expense:[],income:[]}, TYPE='expense', CAT='';
const MONTHS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const eur = n => new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(n||0);
const $ = id => document.getElementById(id);

/* ── API ── */
async function api(action, extra){
  if(!CFG.url) throw new Error('Δεν έχει ρυθμιστεί σύνδεση.');
  const res = await fetch(CFG.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // αποφεύγει το CORS preflight
    body: JSON.stringify(Object.assign({action:action, token:CFG.token}, extra||{})),
    redirect:'follow'
  });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'Άγνωστο σφάλμα');
  return j.data;
}
function status(kind, txt){ $('dot').className = 'dot ' + kind; $('syncTxt').textContent = txt; }

/* ── Boot ── */
function boot(){
  if(!CFG.url || !CFG.token){ $('setup').hidden = false; return; }
  $('app').hidden = false; $('actions').hidden = false;
  $('fDate').value = new Date().toISOString().slice(0,10);
  refresh(); flushQueue();
}
function saveSetup(){
  const u = $('sUrl').value.trim(), t = $('sTok').value.trim();
  if(!u || !t){ toast('Συμπλήρωσε και τα δύο πεδία', true); return; }
  CFG.save(u,t); $('setup').hidden = true; boot();
}
async function refresh(){
  status('busy','Συγχρονισμός');
  try{
    const d = await api('init');
    CATS = d.categories; render(d.summary); renderList(d.recent);
    status('','Συγχρονισμένο');
  }catch(e){ status('off','Χωρίς σύνδεση'); toast(e.message, true); }
}

/* ── Render ── */
function render(s){
  $('mName').textContent = MONTHS[s.month-1];
  $('mYear').textContent = s.year;
  const b = $('bal');
  b.textContent = eur(s.balance);
  b.classList.toggle('neg', s.balance < 0);
  $('inc').textContent = eur(s.income);
  $('exp').textContent = eur(s.expense);

  const max = Math.max.apply(null, s.daily.concat([1]));
  const strip = $('strip');
  strip.innerHTML = '';
  s.daily.forEach((v,i)=>{
    const day = i+1, bar = document.createElement('i');
    if(day > s.today) bar.className = 'future';
    else if(day === s.today) bar.className = 'today';
    else if(v > 0) bar.className = 'spent';
    bar.style.height = (day > s.today ? 1 : Math.max(2, Math.round(v/max*52))) + 'px';
    bar.title = day + ' — ' + eur(v);
    strip.appendChild(bar);
  });
  $('sToday').textContent = s.today;
  $('sEnd').textContent = s.daysInMonth;
}

function renderList(items){
  const el = $('list');
  if(!items || !items.length){ el.innerHTML = '<div class="empty">Καμία κίνηση ακόμη</div>'; return; }
  el.innerHTML = items.map(it=>{
    const d = it.date.split('-');
    const amt = new Intl.NumberFormat('el-GR',{minimumFractionDigits:2}).format(it.amount);
    return '<div class="item">'
      + '<span class="tick ' + (it.type==='income'?'in':'') + '"></span>'
      + '<span class="txt"><span class="t1">' + esc(it.description || it.category) + '</span>'
      + '<span class="t2">' + esc(it.category) + ' · ' + d[2] + '.' + d[1] + '</span></span>'
      + '<span class="amt num ' + (it.type==='income'?'in':'out') + '">'
      + (it.type==='income'?'+':'−') + amt + ' €</span></div>';
  }).join('');
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── Sheet ── */
function openSheet(t){
  setType(t || 'expense');
  $('fDate').value = new Date().toISOString().slice(0,10);
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  $('thumb').style.display = 'none';
}
function setType(t){
  TYPE = t;
  $('tE').classList.toggle('on', t==='expense');
  $('tI').classList.toggle('on', t==='income');
  const list = (t==='expense' ? CATS.expense : CATS.income);
  CAT = list[0] || '';
  const box = $('chips');
  box.innerHTML = '';
  list.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip' + (c===CAT ? ' on' : '');
    b.textContent = c;
    b.onclick = ()=>{ CAT = c; [...box.children].forEach(x=>x.classList.toggle('on', x.textContent===c)); };
    box.appendChild(b);
  });
}
function pickCat(c){
  CAT = c;
  [...$('chips').children].forEach(x=>x.classList.toggle('on', x.textContent===c));
}

/* ── Σκανάρισμα ── */
function pickPhoto(){ $('file').click(); }
async function onPhoto(input){
  const f = input.files && input.files[0];
  if(!f) return;
  input.value = '';
  openSheet('expense');

  const b64 = await toJpeg(f, 1400, .85);
  $('thumbImg').src = 'data:image/jpeg;base64,' + b64;
  $('thumb').style.display = 'block';
  $('thumbOv').style.display = 'flex';

  try{
    const r = await api('scan', {image:b64});
    if(r.amount) $('fAmt').value = r.amount.toFixed(2);
    if(r.date) $('fDate').value = r.date;
    if(r.merchant) $('fDesc').value = r.merchant;
    if(r.category && CATS.expense.indexOf(r.category) !== -1) pickCat(r.category);
    toast('Έλεγξε τα στοιχεία');
  }catch(e){ toast(e.message, true); }
  finally{ $('thumbOv').style.display = 'none'; }
}
function toJpeg(file, maxSide, q){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, maxSide/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg', q).split(',')[1]);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = ()=>rej(new Error('Δεν άνοιξε η φωτογραφία.'));
    img.src = URL.createObjectURL(file);
  });
}

/* ── Καταχώρηση + ουρά offline ── */
async function save(){
  const entry = {
    type: TYPE,
    date: $('fDate').value,
    category: CAT,
    description: $('fDesc').value,
    amount: $('fAmt').value
  };
  if(!entry.category){ toast('Διάλεξε κατηγορία', true); return; }
  if(!entry.date){ toast('Βάλε ημερομηνία', true); return; }
  if(!entry.amount || Number(String(entry.amount).replace(',','.')) <= 0){ toast('Βάλε ποσό', true); return; }

  const btn = $('saveBtn');
  btn.disabled = true; btn.textContent = 'Αποθήκευση…';
  try{
    const r = await api('add', {entry:entry});
    render(r.summary); renderList(r.recent);
    status('','Συγχρονισμένο');
    toast('Καταχωρήθηκε');
  }catch(e){
    queue(entry);
    status('off', pending() + ' σε αναμονή');
    toast('Χωρίς σύνδεση — θα σταλεί αργότερα');
  }finally{
    btn.disabled = false; btn.textContent = 'Καταχώρηση';
    $('fAmt').value = ''; $('fDesc').value = '';
    closeSheet();
  }
}

const QK = 'queue';
const readQ = () => JSON.parse(localStorage.getItem(QK) || '[]');
const writeQ = q => localStorage.setItem(QK, JSON.stringify(q));
const pending = () => readQ().length;
function queue(e){ const q = readQ(); q.push(e); writeQ(q); }

async function flushQueue(){
  const q = readQ();
  if(!q.length) return;
  status('busy','Αποστολή ' + q.length);
  const left = [];
  for(const e of q){
    try{ await api('add', {entry:e}); } catch(err){ left.push(e); }
  }
  writeQ(left);
  if(left.length) status('off', left.length + ' σε αναμονή');
  else { toast('Στάλθηκαν οι εκκρεμείς'); refresh(); }
}
window.addEventListener('online', flushQueue);

/* ── Toast ── */
let tT;
function toast(msg, err){
  const t = $('toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('on');
  clearTimeout(tT); tT = setTimeout(()=>t.classList.remove('on'), 3400);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
boot();
</script>
